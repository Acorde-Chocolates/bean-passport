name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "tools/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check spec, batch files and pages
        run: node tools/check.mjs --chain
      - uses: actions/configure-pages@v5
      - name: Stamp asset versions
        run: find site -name '*.html' -exec sed -i "s/__V__/${GITHUB_SHA::7}/g" {} +
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
